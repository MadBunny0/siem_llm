# GPU-ускорение LLM (опционально): NVIDIA RTX/GTX с поддержкой WSL2.
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Проверка, что модель работает на GPU:
#   docker compose exec ollama ollama ps   — колонка PROCESSOR должна показывать «100% GPU»
#
# Требования: Docker Desktop с бэкендом WSL2 и драйвер NVIDIA, который отдаёт
# GPU в WSL2. Проверка проброса GPU (если устройств нет — см. docs/DEPLOYMENT.md §7):
#   docker run --rm --gpus all ubuntu ls /dev/nvidia*
#
# Без GPU-проброса этот файл просто не применяйте — обычный `docker compose up`
# продолжит работать на CPU.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
