[pytest]
testpaths = tests tests_agent
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# корень репо в sys.path — чтобы `import app...` работал и из контейнера (pytest из Dockerfile), и локально;
# tests_agent — тесты endpoint-агента (импортируют agent/*.py через pytest rootdir)
pythonpath = . agent
addopts = -v --tb=short