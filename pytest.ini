[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# корень репо в sys.path — чтобы `import app...` работал и из контейнера (pytest из Dockerfile), и локально
# (tests_agent удалены в stage-23 вместе с агентами-эмуляторами — реакции идут через Wazuh API)
pythonpath = .
addopts = -v --tb=short