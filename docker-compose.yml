services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: siem
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d siem"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  db-init:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://siem:siem@db:5432/siem
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.init_db"]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # оптимизация инференса (stage-18, фидбек про скорость): flash attention
      # и сжатый KV-кэш q8_0 ускоряют генерацию и вдвое экономят память под кэш
      OLLAMA_FLASH_ATTENTION: "true"
      OLLAMA_KV_CACHE_TYPE: q8_0
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen2.5:3b"]
    restart: "no"

  api:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://siem:siem@db:5432/siem
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      # тюнируемые приложением параметры: значения берутся из .env
      # (см. .env.example), после :- указаны дефолты
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me-in-production}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      TOKEN_EXPIRE_MINUTES: "${TOKEN_EXPIRE_MINUTES:-480}"
      CORRELATION_WINDOW_MINUTES: "${CORRELATION_WINDOW_MINUTES:-5}"
      AUTO_ANALYSIS: "${AUTO_ANALYSIS:-true}"
      # stage-18 (фидбек): автоанализ и автоконвейер — только для low
      AUTO_ANALYSIS_LEVELS: "${AUTO_ANALYSIS_LEVELS:-low}"
      AUTO_CLOSE_LEVELS: "${AUTO_CLOSE_LEVELS:-low}"
      # производительность инференса (stage-18, фидбек про скорость):
      # окно контекста / потолок генерации / удержание модели в памяти
      OLLAMA_NUM_CTX: "8192"
      OLLAMA_NUM_PREDICT: "2048"
      OLLAMA_KEEP_ALIVE: "30m"
      # реальные реакции playbook (stage-23): Wazuh Manager API —
      # POST /active-response доставляет команду AR-скрипта на ВМ актива
      WAZUH_API_URL: "${WAZUH_API_URL:-https://wazuh-manager:55000}"
      WAZUH_API_USER: "${WAZUH_API_USER:-wazuh-wui}"
      WAZUH_API_PASSWORD: "${WAZUH_API_PASSWORD:-wazuh-wui}"
      WAZUH_API_VERIFY_TLS: "${WAZUH_API_VERIFY_TLS:-false}"
      WAZUH_API_TIMEOUT_SECONDS: "${WAZUH_API_TIMEOUT_SECONDS:-15}"
      EXECUTION_DEFAULT_MODE: "${EXECUTION_DEFAULT_MODE:-simulation}"
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  # Веб-интерфейс PostgreSQL (stage-12): http://localhost:8080
  # Сервер: db · Пользователь: siem · Пароль: siem · База: siem
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  # Автотесты бэкенда внутри контейнера — локальный Python не нужен (stage-11):
  # docker compose --profile tests build tests
  # docker compose --profile tests run --rm tests
  tests:
    build:
      context: .
      target: dev
    profiles: ["tests"]
    restart: "no"

  # Автотесты фронтенда (Vitest + RTL) — локальный Node не нужен (stage-13):
  # docker compose --profile tests run --rm frontend-tests
  frontend-tests:
    image: node:22-alpine
    working_dir: /work
    profiles: ["tests"]
    volumes:
      - ./frontend:/work
      - frontend_node_modules:/work/node_modules
    command: sh -c "npm install --no-audit --no-fund --loglevel=error && npx vitest run"
    restart: "no"

  # Wazuh-менеджер (stage-23 — базовый сервис, поднимается обычным `docker
  # compose up`): приём событий от wazuh-агентов на ВМ актива (1514/1515),
  # алерты → интегратор → POST /api/v1/ingest/wazuh, реакции playbook —
  # Wazuh API 55000 (POST /active-response). Настройка после recreate
  # контейнера — один шаг: docker compose exec wazuh-manager bash /wazuh-config/setup.sh
  # (docs/E2E_STAND.md, docs/WAZUH_INTEGRATION.md)
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.4
    environment:
      HOOK_URL: http://api:8000/api/v1/ingest/wazuh
    ports:
      - "1514:1514"       # приём событий от агентов
      - "1515:1515"       # регистрация агентов (agent enrollment)
      - "55000:55000"     # Wazuh API (реакции + диагностика)
    volumes:
      - wazuh_data:/var/ossec/data
      # интегратор: rw — setup.sh делает chmod +x (bind-mount с Windows
      # может терять exec-бит)
      - ./wazuh/integrator.sh:/var/ossec/integrator_files/custom-integration
      # конфиг-фрагменты и скрипты setup
      - ./wazuh/ossec-integration.xml:/wazuh-config/ossec-integration.xml:ro
      - ./wazuh/setup.sh:/wazuh-config/setup.sh:ro
      # кастомные правила стенда (первая группа = event_type для нормализации):
      # поверх дефолтного local_rules.xml (в нём только сэмпл 100001)
      - ./wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml
      # кастомные декодеры (dstuser для useradd/usermod/passwd — сценарий 3):
      # поверх дефолтного local_decoder.xml (только примеры в комментариях)
      - ./wazuh/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml
      # кастомные AR-скрипты реакций (block-ip / lock-account / isolate-host);
      # exec-бит при необходимости ставит setup.sh
      - ./wazuh/ar/block-ip.sh:/var/ossec/active-response/bin/block-ip.sh
      - ./wazuh/ar/lock-account.sh:/var/ossec/active-response/bin/lock-account.sh
      - ./wazuh/ar/isolate-host.sh:/var/ossec/active-response/bin/isolate-host.sh
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  ollama_data:
  wazuh_data:
  frontend_node_modules:
