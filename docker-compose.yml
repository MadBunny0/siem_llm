services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: siem
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d siem"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  db-init:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://siem:siem@db:5432/siem
      # stage-20: seed реестра целей исполнения выполняет db-init — env должен
      # совпадать с api (иначе реестр останется пустым)
      EXECUTION_TARGETS: "wks-finance-12=http://agent-wks:8100|${AGENT_TOKEN:-dev-agent-token},app-web-01=http://agent-app:8100|${AGENT_TOKEN:-dev-agent-token},mail-prod-01=http://agent-mail:8100|${AGENT_TOKEN:-dev-agent-token}"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.init_db"]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # оптимизация инференса (stage-18, фидбек про скорость): flash attention
      # и сжатый KV-кэш q8_0 ускоряют генерацию и вдвое экономят память под кэш
      OLLAMA_FLASH_ATTENTION: "true"
      OLLAMA_KV_CACHE_TYPE: q8_0
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen2.5:3b"]
    restart: "no"

  api:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://siem:siem@db:5432/siem
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      CORRELATION_WINDOW_MINUTES: 5
      AUTO_RESPONSE: "false"
      AUTO_ANALYSIS: "true"
      # stage-18 (фидбек): автоанализ и автоконвейер — только для low
      AUTO_ANALYSIS_LEVELS: "low"
      # производительность инференса (stage-18, фидбек про скорость):
      # окно контекста / потолок генерации / удержание модели в памяти
      OLLAMA_NUM_CTX: "8192"
      OLLAMA_NUM_PREDICT: "2048"
      OLLAMA_KEEP_ALIVE: "30m"
      # stage-20 (реальное исполнение на ВМ): три агента-«ВМ» наблюдаемых
      # пользователей; имена = имена активов seed, токен — общий стенда.
      # Разделитель url/токена — «|» (в URL есть «://» и порт)
      EXECUTION_TARGETS: "wks-finance-12=http://agent-wks:8100|${AGENT_TOKEN:-dev-agent-token},app-web-01=http://agent-app:8100|${AGENT_TOKEN:-dev-agent-token},mail-prod-01=http://agent-mail:8100|${AGENT_TOKEN:-dev-agent-token}"
      EXECUTION_TIMEOUT_SECONDS: "${EXECUTION_TIMEOUT_SECONDS:-10}"
      EXECUTION_DEFAULT_MODE: "${EXECUTION_DEFAULT_MODE:-simulation}"
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  # Веб-интерфейс PostgreSQL (stage-12): http://localhost:8080
  # Сервер: db · Пользователь: siem · Пароль: siem · База: siem
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  # stage-20: агенты-«ВМ» наблюдаемых пользователей — исполнение playbook
  # РЕАЛЬНО меняет состояние узла (фаервол/учётки/изоляция) + генератор
  # активности (алерты Wazuh → SIEM). Имена сервисов согласованы с
  # EXECUTION_TARGETS; имена узлов = имена активов seed.
  # http://localhost:8101/agent/status — состояние АРМ финансиста в браузере
  agent-wks:
    build: ./agent
    environment:
      AGENT_HOSTNAME: wks-finance-12
      AGENT_TOKEN: "${AGENT_TOKEN:-dev-agent-token}"
      SIEM_URL: http://api:8000/api/v1
      AGENT_STATE_FILE: /data/state.json
    ports:
      - "8101:8100"
    volumes:
      - agent_wks_data:/data
    depends_on:
      api:
        condition: service_healthy

  agent-app:
    build: ./agent
    environment:
      AGENT_HOSTNAME: app-web-01
      AGENT_TOKEN: "${AGENT_TOKEN:-dev-agent-token}"
      SIEM_URL: http://api:8000/api/v1
      AGENT_STATE_FILE: /data/state.json
    ports:
      - "8102:8100"
    volumes:
      - agent_app_data:/data
    depends_on:
      api:
        condition: service_healthy

  agent-mail:
    build: ./agent
    environment:
      AGENT_HOSTNAME: mail-prod-01
      AGENT_TOKEN: "${AGENT_TOKEN:-dev-agent-token}"
      SIEM_URL: http://api:8000/api/v1
      AGENT_STATE_FILE: /data/state.json
    ports:
      - "8103:8100"
    volumes:
      - agent_mail_data:/data
    depends_on:
      api:
        condition: service_healthy

  # Автотесты бэкенда внутри контейнера — локальный Python не нужен (stage-11):
  # docker compose --profile tests build tests
  # docker compose --profile tests run --rm tests
  tests:
    build:
      context: .
      target: dev
    profiles: ["tests"]
    restart: "no"

  # Автотесты фронтенда (Vitest + RTL) — локальный Node не нужен (stage-13):
  # docker compose --profile tests run --rm frontend-tests
  frontend-tests:
    image: node:20-alpine
    working_dir: /work
    profiles: ["tests"]
    volumes:
      - ./frontend:/work
      - frontend_node_modules:/work/node_modules
    command: sh -c "npm install --no-audit --no-fund --loglevel=error && npx vitest run"
    restart: "no"

  # Опциональный Wazuh-менеджер (§3.5 ВКР) — запуск: docker compose --profile wazuh up
  # Обычный `docker compose up` его не поднимает. Настройка интеграции — docs/WAZUH_INTEGRATION.md
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.4
    profiles: ["wazuh"]
    environment:
      HOOK_URL: http://api:8000/api/v1/ingest/wazuh
    ports:
      - "1514:1514"       # приём событий от агентов
      - "1515:1515"       # регистрация агентов (agent enrollment)
      - "55000:55000"     # Wazuh API
    volumes:
      - wazuh_data:/var/ossec/data
      - ./wazuh/integrator.sh:/var/ossec/integrator_files/custom-integration:ro
      - ./wazuh/ossec-integration.xml:/wazuh-config/ossec-integration.xml:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  ollama_data:
  wazuh_data:
  frontend_node_modules:
  agent_wks_data:
  agent_app_data:
  agent_mail_data:
